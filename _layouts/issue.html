---
layout: default
---
<article class="issue">
  <header class="issue-head">
    <div class="issue-dateline">
      <span><a class="dateline-home" href="{{ '/' | relative_url }}">THE SUBSCRIBER · A PAPER FROM THE SQUARE</a></span>
      <span>VOL. I · NO. {{ page.issue_no }} · {{ page.date | date: "%Y-%m-%d" }}</span>
    </div>
    <h1 class="issue-title">{{ page.title }}</h1>
    {% if page.dek %}<p class="issue-dek">{{ page.dek }}</p>{% endif %}
    <div class="rule-double"></div>
  </header>
  <div class="content">
    {{ content }}
  </div>
  <nav class="issue-nav">
    <a href="{{ '/' | relative_url }}">← Back to the front page</a>
  </nav>
</article>
