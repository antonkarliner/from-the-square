name: reading-room refresh
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: reading-room-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: crawl (polite, budgeted — also advances the full-text backfill)
        run: node reader/crawler.mjs refresh 200
      - name: commit if anything changed
        run: |
          git config user.name "reading-room[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add reader/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "reading-room: data refresh"
            git pull --rebase
            git push
          fi
